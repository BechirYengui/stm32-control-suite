name: Build desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build & test (Ubuntu, Qt5)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt5 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            qtbase5-dev \
            qtbase5-dev-tools \
            libqt5serialport5-dev \
            qttools5-dev

      - name: Configure
        working-directory: desktop
        run: cmake -S . -B build -DBUILD_TESTS=ON

      - name: Build
        working-directory: desktop
        run: cmake --build build --parallel

      - name: Run tests
        working-directory: desktop/build
        run: ctest --output-on-failure
